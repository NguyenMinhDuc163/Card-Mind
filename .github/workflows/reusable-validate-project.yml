name: Reusable Project Validation

on:
  workflow_call:
    secrets:
      APP_STORE_CONNECT_KEY_ID: { required: true }
      APP_STORE_CONNECT_ISSUER_ID: { required: true }
      APP_STORE_CONNECT_API_KEY_P8: { required: true }
      IOS_TEAM_ID: { required: true }
      MATCH_GIT_URL: { required: true }
      MATCH_PASSWORD: { required: true }
      MATCH_GIT_BASIC_AUTHORIZATION: { required: true }

jobs:
  validate_project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate required secrets and static signing configuration
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8 IOS_TEAM_ID MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION; do
            [ -n "${!name:-}" ] || { echo "❌ $name missing"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          [ "$IOS_TEAM_ID" = "Q236Z72BGN" ] || { echo "❌ IOS_TEAM_ID invalid"; exit 1; }
          [ "$MATCH_GIT_URL" = "https://github.com/NguyenMinhDuc163/apple-signing.git" ] || { echo "❌ MATCH_GIT_URL invalid"; exit 1; }
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" | grep -q "END PRIVATE KEY"
          decoded_auth="$(printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 --decode 2>/dev/null)" || { echo "❌ MATCH_GIT_BASIC_AUTHORIZATION invalid"; exit 1; }
          case "$decoded_auth" in *:*) ;; *) echo "❌ MATCH_GIT_BASIC_AUTHORIZATION invalid"; exit 1 ;; esac
          unset decoded_auth
      - name: Validate apple-signing repository access
        shell: bash
        run: |
          set -euo pipefail
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: Basic $MATCH_GIT_BASIC_AUTHORIZATION" git ls-remote "$MATCH_GIT_URL" HEAD >/dev/null
      - name: Write App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$key_path" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ios
      - name: Prepare Match validation profile directory
        shell: bash
        run: |
          profile_directory="$RUNNER_TEMP/match-profiles"
          mkdir -p "$profile_directory"
          echo "MATCH_VALIDATION_PROFILE_DIRECTORY=$profile_directory" >> "$GITHUB_ENV"
      - name: Validate App Store Connect, Match, and provisioning profile
        working-directory: ios
        run: bundle exec fastlane ios validate_release
      - name: Cleanup App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
